# Repository-wide Python tooling configuration (not a distributable package).
# Packages live in services/pcb-engine and apps/api, each with its own pyproject.

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/engineering", "tests/integration"]
addopts = "-ra --strict-markers"
markers = [
  "postgres: requires a PostgreSQL database (TEST_DATABASE_URL)",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["apps/web", "packages", "node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["via_pcb", "via_api", "via_ai"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S310"]  # S310: tests open local http://127.0.0.1 URLs

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
