[project]
name = "via-eda"
version = "0.1.0"
description = "VIA EDA runner: runs KiCad's own tools (DRC) on uploaded designs, in a credential-free container"
# Runs inside the official KiCad image (Python 3.11) using only the standard library.
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/via_eda"]
