# VIA local development stack.
#
#   cp .env.example .env
#   docker compose up --build
#
# Web: http://localhost:3000   API docs: http://localhost:8000/api/docs
# MinIO console: http://localhost:9001
#
# Networks: postgres, redis and minio are only on the `backend` network; the
# web container can reach only the API (`frontend`). Host ports are bound to
# 127.0.0.1 for local tooling (tests, psql). `backend` is not marked
# `internal: true` because Docker does not publish ports from internal networks.
# The KiCad tool service (`eda`) is only on the internal `eda` network with the worker.

name: via

x-api-env: &api-env
  VIA_ENV: ${VIA_ENV:-development}
  VIA_SECRET_KEY: ${VIA_SECRET_KEY:?set VIA_SECRET_KEY in .env}
  VIA_LOG_LEVEL: ${VIA_LOG_LEVEL:-INFO}
  VIA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-via}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-via}
  VIA_REDIS_URL: redis://redis:6379/0
  VIA_CORS_ORIGINS: ${VIA_CORS_ORIGINS:-http://localhost:3000}
  VIA_STORAGE_BACKEND: s3
  VIA_S3_ENDPOINT_URL: http://minio:9000
  VIA_S3_BUCKET: ${VIA_S3_BUCKET:-via-designs}
  VIA_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-via-minio}
  VIA_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
  VIA_S3_AUTO_CREATE_BUCKET: ${VIA_S3_AUTO_CREATE_BUCKET:-true}
  VIA_MAX_UPLOAD_BYTES: ${VIA_MAX_UPLOAD_BYTES:-52428800}
  VIA_PARSER_TIMEOUT_SECONDS: ${VIA_PARSER_TIMEOUT_SECONDS:-60}
  VIA_PARSER_MEMORY_LIMIT_MB: ${VIA_PARSER_MEMORY_LIMIT_MB:-3072}
  VIA_JOB_MAX_ATTEMPTS: ${VIA_JOB_MAX_ATTEMPTS:-3}
  VIA_JOB_STALE_AFTER_SECONDS: ${VIA_JOB_STALE_AFTER_SECONDS:-90}
  # Internal KiCad tool service (DRC). Unset to run analyses without KiCad DRC.
  VIA_EDA_URL: ${VIA_EDA_URL-http://eda:8100}
  VIA_PUBLIC_WEB_URL: ${VIA_PUBLIC_WEB_URL:-http://localhost:3000}
  VIA_SESSION_TTL_HOURS: ${VIA_SESSION_TTL_HOURS:-336}
  VIA_PASSWORD_RESET_TTL_MINUTES: ${VIA_PASSWORD_RESET_TTL_MINUTES:-60}
  VIA_RATE_LIMIT_ENABLED: ${VIA_RATE_LIMIT_ENABLED:-true}
  # Only the web container (and loopback) can reach the API, so forwarded client IPs are trusted.
  VIA_FORWARDED_ALLOW_IPS: "*"
  # AI (off unless VIA_AI_PROVIDER is set). The key stays in .env; the parser sandbox never sees it.
  VIA_AI_PROVIDER: ${VIA_AI_PROVIDER:-none}
  VIA_AI_MODEL: ${VIA_AI_MODEL:-}
  VIA_AI_EFFORT: ${VIA_AI_EFFORT:-high}
  GROQ_API_KEY: ${GROQ_API_KEY:-}

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-via}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-via}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/database/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    image: ${MINIO_IMAGE:-via/minio:dev}
    build:
      context: .
      dockerfile: infrastructure/docker/minio.Dockerfile
      secrets: [build_ca]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-via-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    networks: [backend]

  # One-shot job: apply migrations and verify storage, then exit.
  migrate:
    image: via/api:dev
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      secrets: [build_ca]
    command: ["sh", "-c", "via-api migrate && via-api init-storage"]
    environment: *api-env
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    networks: [backend]
    restart: "no"

  api:
    image: via/api:dev
    pull_policy: never  # built locally by the migrate service; never pulled from a registry
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    networks: [backend, frontend]

  # Background jobs: PCB imports. Parsing runs in a credential-free, resource-limited
  # subprocess inside this container (see apps/api/src/via_api/parsing/sandbox.py).
  worker:
    image: via/api:dev
    pull_policy: never  # built locally by the migrate service; never pulled from a registry
    command: ["via-api", "worker"]
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      disable: true  # the image's HTTP healthcheck is for the API
    networks: [backend, eda]
    restart: unless-stopped

  eda:
    # KiCad 9 (official image) running DRC for analyses. No credentials, no published ports,
    # reachable only from the worker on the internal `eda` network; read-only root filesystem.
    build:
      context: .
      dockerfile: infrastructure/docker/eda.Dockerfile
    image: via/eda:dev
    environment:
      VIA_EDA_CONCURRENCY: ${VIA_EDA_CONCURRENCY:-2}
      VIA_EDA_TIMEOUT_SECONDS: ${VIA_EDA_TIMEOUT_SECONDS:-120}
      VIA_EDA_MEMORY_LIMIT_MB: ${VIA_EDA_MEMORY_LIMIT_MB:-4096}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [eda]
    restart: unless-stopped

  web:
    image: via/web:dev
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      secrets: [build_ca]
      args:
        VIA_API_INTERNAL_URL: http://api:8000
        VIA_MAX_UPLOAD_BYTES: ${VIA_MAX_UPLOAD_BYTES:-52428800}
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    networks: [frontend]

networks:
  backend: {}
  frontend: {}
  # No route outside Docker: only the worker and the KiCad service are on it.
  eda:
    internal: true

secrets:
  # Optional extra CA bundle for image builds behind a TLS-intercepting proxy.
  # Defaults to an intentionally empty file (no effect); never baked into images.
  # (Not /dev/null: newer Buildx rejects secret sources outside the context.)
  build_ca:
    file: ${VIA_BUILD_CA_CERT:-./infrastructure/docker/no-extra-ca.pem}

volumes:
  postgres-data:
  minio-data:
